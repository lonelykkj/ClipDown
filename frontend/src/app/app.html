<main class="min-h-dvh flex items-center justify-center px-4 py-10 text-zinc-100">
  <div class="w-full max-w-xl flex flex-col items-center gap-10">
    <header class="text-center">
      <h1
        class="font-title text-6xl sm:text-8xl font-bold tracking-tight bg-linear-to-r from-violet-300 via-violet-500 to-fuchsia-500 bg-clip-text text-transparent"
      >
        ClipDown
      </h1>
      <p class="mt-3 text-sm text-zinc-400">Baixe e converta mídia. Sem anúncios, sem pop-ups.</p>
    </header>

    <form class="w-full flex flex-col gap-4" (submit)="$event.preventDefault(); start()">
      @if (selected().input === 'url') {
        <input
          type="url"
          name="url"
          placeholder="Cole o link aqui..."
          autocomplete="off"
          aria-label="Link do vídeo"
          [value]="url()"
          (input)="url.set($any($event.target).value)"
          class="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-4 py-3.5 text-base placeholder:text-zinc-500 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30"
        />
      } @else {
        <label
          class="flex flex-col items-center justify-center gap-1 rounded-xl border-2 border-dashed px-4 py-8 text-center cursor-pointer transition"
          [class]="
            dragging()
              ? 'border-violet-500 bg-violet-500/10'
              : 'border-zinc-800 bg-zinc-900 hover:border-zinc-700'
          "
          (dragover)="$event.preventDefault(); dragging.set(true)"
          (dragleave)="dragging.set(false)"
          (drop)="onDrop($event)"
        >
          @if (file(); as f) {
            <span class="font-medium text-zinc-100 break-all">{{ f.name }}</span>
            <span class="text-xs text-zinc-500">Clique ou arraste para trocar</span>
          } @else {
            <span class="text-zinc-300">Clique ou arraste um arquivo aqui</span>
            <span class="text-xs text-zinc-500">{{ selected().hint }}</span>
          }
          <input
            type="file"
            class="sr-only"
            [accept]="selected().accept ?? ''"
            (change)="onFileInput($event)"
          />
        </label>
      }

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="flex flex-col gap-1.5">
          <span class="text-xs uppercase tracking-wider text-zinc-500">Função</span>
          <select
            name="function"
            (change)="selectFunction($any($event.target).value)"
            class="rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-3 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30"
          >
            @for (f of functions; track f.id) {
              <option [value]="f.id" [selected]="f.id === selected().id">{{ f.label }}</option>
            }
          </select>
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-xs uppercase tracking-wider text-zinc-500">Formato</span>
          <select
            name="format"
            (change)="format.set($any($event.target).value)"
            [disabled]="selected().formats.length === 1"
            class="rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-3 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30 disabled:opacity-60"
          >
            @for (fmt of selected().formats; track fmt) {
              <option [value]="fmt" [selected]="fmt === format()">{{ fmt }}</option>
            }
          </select>
        </label>
      </div>

      <button
        type="submit"
        [disabled]="!canStart()"
        class="mt-2 rounded-xl bg-violet-500 px-6 py-3.5 font-medium text-white transition hover:bg-violet-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400 disabled:cursor-not-allowed disabled:bg-zinc-800 disabled:text-zinc-500"
      >
        {{ loading() ? 'Processando...' : 'Iniciar' }}
      </button>

      @if (message(); as m) {
        <p
          [attr.role]="m.isError ? 'alert' : 'status'"
          class="text-sm text-center"
          [class]="m.isError ? 'text-red-400' : 'text-emerald-400'"
        >
          {{ m.text }}
        </p>
      }
    </form>

    <footer class="text-xs text-zinc-600">Uso pessoal · respeite os direitos autorais</footer>
  </div>
</main>
